services:
  timesheet:
    build: .
    environment:
      - PORT=${PORT:-3001}
      - LOG_DIR=/app/logs
      - LOG_LEVEL=${LOG_LEVEL:-error}
    ports:
      - "${PORT:-3001}:${PORT:-3001}"
    volumes:
      - ${DATA_DIR:-./data}:/app/data
      - ${LOG_DIR:-./logs}:/app/logs
    restart: unless-stopped
    healthcheck:
      # Runs INSIDE this container, so localhost is the app itself.
      # $$PORT is expanded inside the container (its actual listen port).
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:$$PORT/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
